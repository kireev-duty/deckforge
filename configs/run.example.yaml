# Воспроизводимый прогон: deckforge run --config configs/run.example.yaml
template: ../Датасет/VK Tech шаблон.pptx
content_pack: examples/content_pack          # brief.md + data/*.csv|json + product.md
purpose: product                             # feature | product | project | initiative | report
audience: "руководители продуктовых команд"
language: ru
target_slides: 12                            # или null — по стратегии
strategies: [executive, narrative, visual]   # три варианта вёрстки
images: auto                                 # off | auto | always
audit:
  deterministic: true
  contextual: true
  autofix: true                              # применить безопасные фиксы без вопросов
export: [pptx, pdf, html]
output_dir: examples/output/vk_tech
seed: 42
