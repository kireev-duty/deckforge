# Финальный прогон: три варианта на шаблоне «vk_tech» → examples/output/vk_tech/
#   .venv\Scripts\python.exe -m deckforge.cli run -c configs/final/vk_tech.yaml
# На входе только шаблон (контент-пакета в датасете нет): бриф выводит скилл template_brief
# и кладёт в examples/output/vk_tech/brief.md. Этот прогон — первый: полученный outline.json
# идёт на остальные три шаблона через --outline (ТЗ §6: один контент × 3 шаблона × 3 варианта).

template: data/templates/VK Tech шаблон.pptx
purpose: other                               # назначение и аудиторию предложит template_brief
audience: ""
language: ru
target_slides: 12
talk_minutes: 7                              # текст выступления к слайдам — на 7 минут
strategies: [executive, narrative, visual]
images: auto
audit:
  deterministic: true
  contextual: true
  autofix: true
export: [pptx, pdf, html]
output_dir: examples/output/vk_tech
render_png: true
render_dpi: 72
seed: 42
