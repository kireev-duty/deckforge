# Публичный демо-стенд: staging-папка (deploy/hf_space/stage.py) → Hugging Face Space, который сам собирает Docker-образ.
# Секреты репозитория: HF_TOKEN (write-токен HF). Переменная репозитория HF_SPACE (по умолчанию <владелец HF>/deckforge).
# Ключ LLM в GitHub не нужен: он лежит в Secrets самого Space (DEVELOPMENT.md, «Демо-стенд»).
name: deploy-space

# Только ручной запуск: бесплатный CPU для Docker-Spaces требует HF PRO; основной стенд — Streamlit Community Cloud.
on:
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Шаблоны датасета из LFS (только data/, без 225 МБ примеров)
        run: git lfs pull --include "data/templates/**,data/holdout/**"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Staging
        run: python deploy/hf_space/stage.py staging
      - name: Загрузка в Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install -q "huggingface_hub>=0.30"
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ.get("HF_SPACE") or f"{api.whoami()['name']}/deckforge"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(repo_id=space, repo_type="space", folder_path="staging", delete_patterns="*",
                            commit_message=f"deploy {os.environ['GITHUB_REF_NAME']} ({os.environ['GITHUB_SHA'][:7]})")
          print(f"https://huggingface.co/spaces/{space}")
          EOF
