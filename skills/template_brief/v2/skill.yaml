name: template_brief
version: v2
model_role: text
temperature: 0.5
max_tokens: 2000
response_format: json_schema   # schema.json
inputs: [template_digest, language, target_slides, purpose_hint, audience_hint]
changelog: |
  v2 — объём брифа привязан к объёму колоды. В v1 модель давала 5–8 тезисов, outline_writer делал
  слайд на тезис, и на выходе получалось 9 слайдов при целевых 12 — ниже требования ТЗ (10–15).
  Теперь тезисов столько, сколько содержательных слайдов (target_slides − 2, от 8 до 16), и задан
  их состав: проблема, решение, устройство, сценарии, этапы внедрения, выгоды, следующий шаг —
  чтобы планировщику досталось не только `cards`, но и `process` с двумя колонками.
  v1 — режим «на входе только шаблон» (ни брифа, ни контент-пакета). По слепку шаблона
  (имя файла, палитра, шрифты, архетипы образцов, теги VLM, тексты слайдов-образцов)
  модель определяет бренд и тему и пишет короткий бриф, который дальше идёт в outline_writer
  вместо brief.md. Цифры, даты, имена клиентов и цитаты не выдумываются: проверить их нечем,
  а судья (C04) ловит несамосогласованность.
