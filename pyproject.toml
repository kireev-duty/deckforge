[project]
name = "deckforge"
version = "0.1.2"
description = "Digital presentation designer: parses any .pptx template into a design system and generates on-brand decks from a brief"
requires-python = ">=3.12"
dependencies = [
    "python-pptx>=1.0",
    "lxml>=5",
    "pydantic>=2",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pillow>=10",
    "typer>=0.12",
    "pyyaml>=6",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "pywin32; sys_platform == 'win32'", "playwright>=1.40"]  # pywin32 — tools/powerpoint_check.py, playwright — tools/browser_check.py

[project.scripts]
deckforge = "deckforge.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deckforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
