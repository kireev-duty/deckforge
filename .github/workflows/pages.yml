# Галерея готовых колод examples/output на GitHub Pages (tools/build_gallery.py): HTML и PDF колод + превью.
# Settings → Pages → Source: GitHub Actions. Переменная репозитория DEMO_URL — ссылка на демо-стенд для кнопки.
name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: HTML и PDF колод из LFS (≈30 МБ; .pptx — ссылками на репозиторий)
        run: git lfs pull --include "examples/output/*/*.html,examples/output/*/*.pdf"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pymupdf
      - name: Галерея
        run: python tools/build_gallery.py --out site --ref "${GITHUB_REF_NAME}" --demo-url "${{ vars.DEMO_URL }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
