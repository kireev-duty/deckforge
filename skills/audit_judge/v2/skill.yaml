name: audit_judge
version: v2
model_role: vision
temperature: 0.0
max_tokens: 1200
response_format: json_schema
inputs: [slide_idx, slide_title, slide_text, prev_slide_title, next_slide_title, source_facts, language]
changelog: |
  v2 — C04 про самосогласованность. Исходных материалов на входе может не быть вовсе (режим
  «только шаблон»: бриф выводится из самого шаблона), и вопрос «все ли факты есть в исходниках»
  тогда бессмысленно валил каждый содержательный слайд. Новая формулировка: цифры и утверждения
  не противоречат друг другу, заголовку и соседним слайдам, нет заглушек и неправдоподобных значений;
  если исходные материалы переданы — слайд не должен им противоречить. Блок фактов может быть пустым.
  v1 — 11 да/нет вопросов из Приложения 1 ТЗ по PNG слайда + текст слайда + факты из источника.
