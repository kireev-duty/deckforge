name: context_digest
version: v1
model_role: text
temperature: 0.2
max_tokens: 3000
response_format: json_schema   # schema.json
inputs: [chunk, source_ids, language, max_facts]
changelog: |
  v1 — контекст из репозитория, документации и истории (вводная жюри: «контекст на входе — репозиторий,
  документация и история; подготовка контекста — без лимита времени»). Источники режутся на чанки ≈ 8 тыс.
  символов, скилл вызывается на каждый чанк параллельно и выписывает факты о проекте со ссылками на id
  источников и весом для презентации. Факты по весу отбираются в лимит промпта outline_writer (12 тыс. символов)
  и становятся фрагментами `fact:<n>` контент-пакета. Задачи (темы) во входе нет: подготовка идёт до генерации
  и от задачи не зависит.
