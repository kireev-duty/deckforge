name: speaker_notes
version: v2
model_role: text
temperature: 0.5
max_tokens: 6000
response_format: json_schema   # schema.json
inputs: [deck_title, purpose, audience, language, talk_minutes, total_words, brief, slides]
changelog: |
  v2 — объём в предложениях. Первый живой прогон v1 (VK Tech, готовый outline, 7 минут, три стратегии) дал
  текст хорошего качества, но в 2–3 раза короче бюджета: 289–472 слова вместо ≈ 840, 2,4–3,9 мин вместо 7 —
  модель писала 2–3 предложения на слайд, какой бы `words` ни стоял во входе. Слова модель не считает,
  предложения — считает: у каждого слайда во входе теперь и `sentences` (≈ words / 12), в промпте — итоговый
  объём (`total_words`) и прямое правило «короче — ошибка». max_tokens 5000 → 6000 под вдвое более длинный ответ.
  v1 — текст выступления к каждому слайду (вводная жюри: «на выходе слайды и текст к каждому слайду;
  выступление ограничено по длительности»). Вызывается на готовую колоду каждой стратегии, а не на outline:
  состав слайдов у вариантов разный (разделители, продолжения, слитые слайды), а текст должен идти к каждому.
