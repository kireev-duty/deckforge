# Стратегия «visual»: данные — графиками, процессы — схемами, иконки и картинки вместо текста.
# Ось: любой числовой ряд и любое сравнение — диаграмма; текст — короткие тезисы в карточках с пиктограммами.
# Схема полей — deckforge/core/strategy.py (Strategy).
name: visual
version: v2
target_slides: {min: 10, max: 12}
density:
  max_bullets: 6
  max_words_per_bullet: 8
  max_fill_ratio: 0.7
archetype_priority: [chart, process, cards, image_text, kpi, image_full, agenda, bullets, two_column, section, table]
data_visualization: {numeric_series: chart, comparison: chart, key_metrics: kpi}
sections: false
images: always           # каждому слайду без графика/схемы — иконка или иллюстрация
icons: true              # буллеты сопровождаются пиктограммами
process_form: diagram    # шаги — всегда схемой: SmartArt «Простой процесс» в цветах шаблона
audience_hint: публичная защита, конференция, маркетинг — цифры и процессы видны с задних рядов
outline_rules: |
  Любой числовой ряд — диаграмма с подписями осей и единицами. Любая последовательность действий — схема шагов (process).
  Текст — короткие тезисы (≤8 слов), каждому тезису — пиктограмма. Таблицы только если данные нельзя показать графиком.
