name: speaker_notes
version: v3
model_role: text
temperature: 0.5
max_tokens: 6000
response_format: json_schema   # schema.json
inputs: [deck_title, purpose, audience, language, talk_minutes, total_words, brief, slides]
changelog: |
  v3 — длина предложения. v2 модель выполнила буквально: ровно `sentences` предложений на слайд, но по 5–7 слов
  («Гибкое расширение функциональности под рост бизнеса.»), и колоды вышли на 3,4–5,6 мин вместо 7. Правило 1
  теперь задаёт предложение из 12–18 слов с причиной и следствием («потому что», «это значит, что…») и прямо
  запрещает рубленые и назывные фразы. Сравнение на одной колоде (VK Tech executive, 7 мин, один вызов на вариант):
  v2 с 8 словами на предложение — 55 % бюджета слов; «три части на слайд» — 61 %; v3 — 92 % (6,4 мин),
  текст связный, без обрывков.
  v2 — объём в предложениях: у слайда во входе `sentences` (≈ words / 12), в промпте итог `total_words`.
  v1 писала в 2–3 раза короче бюджета (2,4–3,9 мин из 7).
  v1 — текст выступления к каждому слайду (вводная жюри: «на выходе слайды и текст к каждому слайду;
  выступление ограничено по длительности»). Вызывается на готовую колоду каждой стратегии, а не на outline:
  состав слайдов у вариантов разный (разделители, продолжения, слитые слайды), а текст должен идти к каждому.
