# Финальный прогон: три варианта на шаблоне «vk_education» → examples/output/vk_education/
#   .venv\Scripts\python.exe -m deckforge.cli run -c configs/final/vk_education.yaml
# Один outline на все шаблоны: сначала прогнать vk_tech, затем остальные с --outline examples/output/vk_tech/outline.json

template: data/templates/Шаблон презентации VK Education.pptx
