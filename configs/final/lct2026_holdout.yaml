# Финальный прогон: три варианта на шаблоне «lct2026_holdout» → examples/output/lct2026_holdout/
#   .venv\Scripts\python.exe -m deckforge.cli run -c configs/final/lct2026_holdout.yaml ^
#       --outline examples/output/vk_tech/outline.json
# Контент один на все шаблоны и выведен из шаблона VK Tech (контент-пакета в датасете нет).
# holdout: шаблон не использовался при калибровке правил парсинга — проверка адаптивности
template: data/holdout/ЛЦТ2026 Шаблон презентации.pptx
purpose: other
audience: ""
language: ru
target_slides: 12
talk_minutes: 7                              # текст выступления к слайдам — на 7 минут
strategies: [executive, narrative, visual]
images: auto
audit:
  deterministic: true
  contextual: true
  autofix: true
export: [pptx, pdf, html]
output_dir: examples/output/lct2026_holdout
render_png: true
render_dpi: 72
seed: 42
