# Воспроизводимый прогон: deckforge run --config configs/run.example.yaml
# (или .venv\Scripts\python.exe -m deckforge.cli run -c configs/run.example.yaml [--png] [--outline готовый.json])
# Относительные пути — от корня репозитория.
# На входе только шаблон — контента в датасете нет: бриф выводит скилл template_brief
# и пишет в <output_dir>/brief.md. Свой контент включается одной из двух строк ниже:
#   content_pack: examples/content_pack      # папка: brief.md + *.md + data/*.json|csv|xlsx
#   topic: "Платформа для команд: что она даёт"   # или тема одной строкой (флаг --topic)
template: data/templates/VK Tech шаблон.pptx
purpose: other                               # feature | product | project | initiative | report | other
audience: ""                                 # пусто — назначение и аудиторию предложит template_brief
language: ru
target_slides: 12                            # ориентир для outline; итоговый объём задаёт стратегия
speaker_notes: true                          # текст выступления к каждому слайду (заметки .pptx, speech.md; --no-notes выключает)
talk_minutes: 7                              # длительность выступления, под неё пишется текст (--minutes)
strategies: [executive, narrative, visual]   # три варианта вёрстки на одном outline
images: auto                                 # off | auto (по стратегии: executive без картинок, narrative — где уместно, visual — везде) | always
audit:
  deterministic: true                        # 26 проверок по XML (docs/AUDIT.md) → <strategy>.audit.json
  contextual: true                           # VLM-судья по PNG (нужны LibreOffice и API; --no-judge выключает)
  autofix: true                              # безопасные фиксы без вопросов → re-render → повторный аудит (--no-fix выключает)
export: [pptx, pdf, html]                    # pdf — LibreOffice; html — свой рендер (один файл, без LibreOffice); всё рядом с .pptx
output_dir: out/run/vk_tech                  # финальные 9 колод складываются в examples/output/ отдельным прогоном
render_png: false                            # PNG-превью + contact.png (LibreOffice, ~10 с на колоду)
seed: 42
