# Финальный прогон (день 11): три варианта на шаблоне «lct2026_holdout» → examples/output/lct2026_holdout/
#   .venv\Scripts\python.exe -m deckforge.cli run -c configs/final/lct2026_holdout.yaml
# Один outline на все шаблоны: сначала прогнать vk_tech, затем остальные с --outline examples/output/vk_tech/outline.json
